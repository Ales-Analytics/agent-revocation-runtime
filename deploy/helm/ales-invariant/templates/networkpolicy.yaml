{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ales.fullname" . }}
  labels:
    {{- include "ales.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ales.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- $ing := .Values.networkPolicy.ingress }}
    {{- if or $ing.namespaceSelectors $ing.podSelectors $ing.ipBlocks }}
    - from:
        {{- range $ing.namespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range $ing.podSelectors }}
        - podSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- range $ing.ipBlocks }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
    {{- else }}
    []
    {{- end }}
  egress:
    {{- $eg := .Values.networkPolicy.egress }}
    {{- if $eg.dnsEnabled }}
    - to:
        - namespaceSelector:
            {{- toYaml $eg.dnsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if $eg.databaseCidrs }}
    - to:
        {{- range $eg.databaseCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ $eg.databasePort }}
    {{- end }}
    {{- if $eg.databaseSelector }}
    - to:
        - {{- toYaml $eg.databaseSelector | nindent 10 }}
      ports:
        - protocol: TCP
          port: {{ $eg.databasePort }}
    {{- end }}
    {{- if $eg.extraCidrs }}
    - to:
        {{- range $eg.extraCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
