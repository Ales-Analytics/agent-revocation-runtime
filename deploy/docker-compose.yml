services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: invariant
      POSTGRES_DB: invariant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invariant"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  invariant-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:invariant@postgres:5432/invariant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
