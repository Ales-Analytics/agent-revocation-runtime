name: Live-store evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ALES_TEST_QDRANT_URL: http://127.0.0.1:6333
      ALES_TEST_PG_URL: postgresql+psycopg://postgres:ci@127.0.0.1:5432/postgres
      ALES_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      BENCH_POSTGRES_URL: postgresql+psycopg://postgres:ci@127.0.0.1:5432/postgres
      BENCH_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ".[dev,qdrant,pgvector]"
      - run: python -m ales_conformance.report --require-live
        env: {PYTHONPATH: conformance}
      - run: pytest -q adapters/tests/test_real_stores.py conformance
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -m revocationbench --profile inprocess
          python -m revocationbench --profile postgres
        env: {PYTHONPATH: benchmark}
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}
          path: |
            conformance/report.md
            docs/coverage-matrix.md
            ${{ startsWith(github.ref, 'refs/tags/') && 'benchmark/reports/latest*' || '' }}
