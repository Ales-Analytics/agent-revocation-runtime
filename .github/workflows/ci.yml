name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy core/ales_core server/ales_server sdk-python/ales_sdk --no-error-summary
      # Full configured testpaths (core, server, sdk, adapters, conformance, benchmark, examples). The
      # adapters/conformance/benchmark/examples packages put themselves on sys.path; no extra install needed.
      - run: pytest -q
      - run: python -m revocationbench
        env: {PYTHONPATH: benchmark}
  stress:
    # Concurrency / multi-process / real-Postgres evidence. Not in pyproject testpaths (slower).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: ci}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q stress
  typescript-sdk:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: sdk-typescript}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: sdk-typescript/package-lock.json}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      # Wire-level parity against the real Python server (same flow the Python SDK e2e test runs).
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "..[dev]"
      - run: npm test
        env: {ALES_ITEST: "1"}
  deploy-validate:
    # Real-tool validation of the deployment templates (terraform/helm are not installed on the
    # development machine; this job is the authoritative check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "1.9.8"}
      - name: terraform fmt + validate (all modules)
        run: |
          set -e
          for d in deploy/terraform/modules/core deploy/terraform/azure deploy/terraform/aws deploy/terraform/gcp; do
            echo "== $d"
            terraform -chdir="$d" fmt -check -recursive
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
      - uses: azure/setup-helm@v4
        with: {version: "v3.16.3"}
      - name: helm lint + template
        run: |
          set -e
          helm lint deploy/helm/ales-invariant -f deploy/helm/ales-invariant/values-dev.yaml
          helm template test deploy/helm/ales-invariant \
            -f deploy/helm/ales-invariant/values-dev.yaml \
            --set secrets.existingSecret=dummy >/dev/null
