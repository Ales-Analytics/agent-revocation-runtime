[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ales-invariant"
version = "0.1.0"
description = "Context integrity and revocation runtime for AI systems. Context must never outlive its authority."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=42",
    "jsonschema>=4.22",
    "rfc8785>=0.1.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "psycopg[binary]>=3.1",
    "moto[s3]>=5",
]
demo = ["pgvector>=0.2", "langgraph>=0.1", "langchain-core>=0.2"]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["pgvector>=0.3"]
connectors = ["boto3>=1.34", "azure-storage-blob>=12.19"]
llamaindex = ["llama-index-core>=0.11"]

[project.scripts]
ales = "ales_sdk.cli:main"

[tool.setuptools.package-dir]
ales_core = "core/ales_core"
ales_server = "server/ales_server"
ales_sdk = "sdk-python/ales_sdk"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "server/tests", "sdk-python/tests", "adapters/tests", "connectors/tests", "conformance", "benchmark/tests", "examples/tests"]
