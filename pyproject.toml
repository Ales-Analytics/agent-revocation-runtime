[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-revocation-runtime"
version = "0.3.0"
description = "Context integrity and revocation runtime for AI systems. Context must never outlive its authority."
keywords = ["rag", "ai agents", "data lineage", "authorization", "revocation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
readme = "sdk-python/README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=42",
    "jsonschema>=4.22",
    "rfc8785>=0.1.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "psycopg[binary]>=3.1",
    "moto[s3]>=5",
]
demo = ["pgvector>=0.2", "langgraph>=0.1", "langchain-core>=0.2"]
postgres = ["psycopg[binary]>=3.1"]
qdrant = ["qdrant-client>=1.9"]
pgvector = ["pgvector>=0.3"]
connectors = ["boto3>=1.34", "azure-storage-blob>=12.19"]
llamaindex = ["llama-index-core>=0.11"]

[project.scripts]
ales = "ales_sdk.cli:main"

[project.urls]
Homepage = "https://www.alesanalytics.com/agent-revocation-runtime"
Changelog = "https://github.com/Ales-Analytics/agent-revocation-runtime/blob/main/CHANGELOG.md"
Repository = "https://github.com/Ales-Analytics/agent-revocation-runtime"
Documentation = "https://www.alesanalytics.com/agent-revocation-runtime/quickstart"
Issues = "https://github.com/Ales-Analytics/agent-revocation-runtime/issues"

[tool.setuptools.package-dir]
ales_core = "core/ales_core"
ales_server = "server/ales_server"
ales_sdk = "sdk-python/ales_sdk"
ales_adapters = "adapters/ales_adapters"
ales_connectors = "connectors/ales_connectors"

[tool.setuptools.package-data]
ales_core = ["alembic/*", "alembic/versions/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["core/tests", "server/tests", "sdk-python/tests", "adapters/tests", "connectors/tests", "conformance", "benchmark/tests", "examples/tests"]
